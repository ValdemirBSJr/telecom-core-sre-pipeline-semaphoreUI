      - 'show running-config | include access-group'
      - 'show running-config full verbose | include shared'
      - 'show running-config full verbose | include dynamic-secret'
      - 'show running-config full verbose | include tftp-enforce'
      - 'show running-config full verbose | include mandatory'
      - 'show running-config full verbose | include source-verify'
VER:
